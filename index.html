<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07020f" />
  <title>NEXUS-77</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" />
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="넥서스-77 구역과 캐릭터 3D 장면"></canvas>
    <div class="scrim" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>
        <span>NEXUS-77</span>
      </div>
      <span id="demo-no" class="muted">DISTRICT 01 / 05</span>
    </header>

    <section class="info" aria-live="polite">
      <div class="pill"><span class="pill-k">DISTRICT</span><span id="zone"></span></div>
      <h1 id="district-name"></h1>
      <span id="district-en" class="en"></span>
      <div class="rule" aria-hidden="true"></div>
      <span id="char-tag" class="label"></span>
      <span id="char-name" class="char"></span>
      <p id="char-bio"></p>
      <div id="palette" class="palette" aria-label="컬러 팔레트"></div>
      <button id="play" class="play-btn" type="button"></button>
    </section>

    <nav class="dock" aria-label="구역 선택">
      <div id="tabs" class="tabs"></div>
      <button id="spin" type="button" aria-pressed="false" aria-label="캐릭터 360도 회전">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
      </button>
    </nav>
    <div id="game-ui"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
